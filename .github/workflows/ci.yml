name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: '56 20 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo test --workspace --no-default-features --all-targets
    - run: cargo test --workspace --all-targets
    - run: cargo test --workspace --all-features --all-targets
    - run: cargo test --workspace --all-features --doc

  # Each feature is checked alone, because a feature that only compiles
  # alongside another breaks the apps that take it alone.
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - run: cargo clippy --all-targets --no-default-features -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features alloc -- -D warnings
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features browser -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features yew023 -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features koine03 -- -D warnings
    - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - run: cargo clippy -p phrasebook-catalog --all-targets -- -D warnings
    - run: cargo clippy -p phrasebook-catalog --all-targets --features koine03 -- -D warnings
    - run: cargo clippy -p phrasebook-catalog --all-targets --features yew023 -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy
    - run: cargo build --target wasm32-unknown-unknown --no-default-features
    - run: cargo build --target wasm32-unknown-unknown --no-default-features --features browser
    - run: cargo build --target wasm32-unknown-unknown --all-features
    - run: cargo build -p phrasebook-catalog --target wasm32-unknown-unknown
    - run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo doc --workspace --all-features --no-deps

  # How docs.rs builds the docs, with the feature badges of `doc(cfg)`.
  docsrs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg phrasebook_docsrs -D warnings
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
    - run: cargo doc --workspace --all-features --no-deps

  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --check --all

[package]
name = "phrasebook"
version = "0.2.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "Fluent localization for Rust web frontends: message catalogs per language, arguments and plurals, a remembered language choice in the browser."
documentation = "https://docs.rs/phrasebook"
readme = "README.md"
repository = "https://github.com/udoprog/phrasebook"
license = "MIT OR Apache-2.0"
keywords = ["fluent", "i18n", "l10n", "localization", "wasm"]
categories = ["internationalization", "localization", "wasm", "web-programming"]
include = ["/src/**", "/tests/**", "/examples/tour.rs", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[workspace]
members = ["crates/phrasebook-catalog"]
exclude = ["examples/app"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(phrasebook_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "phrasebook_docsrs"]

[features]
default = ["std"]
std = ["alloc", "dep:fluent-bundle", "dep:fluent-syntax", "dep:unic-langid", "dep:tracing", "tracing/std", "koine03?/std"]
alloc = ["koine03?/alloc"]
browser = ["std", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:intl-memoizer"]
yew023 = ["std", "dep:yew023", "phrasebook-catalog/yew023"]
koine03 = ["std", "dep:koine03", "phrasebook-catalog/koine03"]

# `Lang`, `Source` and `Catalog`, re-exported at the crate root. Not pinned:
# it is released on its own, so a library's catalog outlives phrasebook's
# breaking releases.
[dependencies]
phrasebook-catalog = { path = "crates/phrasebook-catalog", version = "0.1.0" }
fluent-bundle = { version = "0.16.0", optional = true }
fluent-syntax = { version = "0.12.0", optional = true }
unic-langid = { version = "0.9.6", optional = true }
tracing = { version = "0.1.44", default-features = false, optional = true }
yew023 = { package = "yew", version = "0.23.0", optional = true }
koine03 = { package = "koine", version = "0.3.0", default-features = false, features = ["locale"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.77", features = ["Document", "Element", "Navigator", "Storage", "Window"], optional = true }
js-sys = { version = "0.3.77", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
intl-memoizer = { version = "0.5.3", optional = true }

# Cargo allows one key per crate, so tests use `extern crate yew023 as yew;`
# for yew's macros.
[dev-dependencies]
yew023 = { package = "yew", version = "0.23.0", features = ["ssr"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[[example]]
name = "tour"
required-features = ["std"]

[package]
name = "phrasebook-catalog"
version = "0.1.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "The language identifier and message catalog types of phrasebook, in their own crate so a library's catalog outlives phrasebook's breaking releases."
documentation = "https://docs.rs/phrasebook"
readme = "README.md"
repository = "https://github.com/udoprog/phrasebook"
license = "MIT OR Apache-2.0"
keywords = ["fluent", "i18n", "l10n", "localization", "no_std"]
categories = ["internationalization", "localization", "no-std", "wasm"]
include = ["/src/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(phrasebook_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "phrasebook_docsrs"]

# No features by default, and none needs `std` or `alloc` of its own. Each
# versioned feature adds trait impls on `Lang` for a dependency that is not
# yet 1.0, so a later version is a feature beside it, not a breaking release.
[features]
koine03 = ["dep:koine03"]
yew023 = ["dep:yew023"]

[dependencies]
koine03 = { package = "koine", version = "0.3.0", default-features = false, features = ["locale"], optional = true }
yew023 = { package = "yew", version = "0.23.0", optional = true }
